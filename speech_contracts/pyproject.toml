[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-contracts"
version = "0.1.0"
description = "Dependency-free audio experiment request and configuration contracts"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
