[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-pipeline"
version = "0.1.0"
description = "Standalone audio-in/audio-out MiniCPM, Whisper and Granite tool pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "speech-contracts==0.1.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14",
  "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1", "ruff>=0.9"]
models = [
  "kokoro>=0.9.4",
  "soundfile>=0.12",
  "numpy>=2",
  "scipy",
  "torch",
  "transformers>=4.54",
  "accelerate",
  "bitsandbytes==0.48.2; sys_platform == 'linux'",
  "faster-whisper",
  "av>=11,<19",
  "nvidia-ml-py",
]

[project.scripts]
speech-runtime = "tool_pipeline.service.api:main"
speech-infer = "tool_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
