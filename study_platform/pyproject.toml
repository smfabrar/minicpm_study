[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-study"
version = "0.1.0"
description = "FastAPI study management, audio storage, review and analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "speech-contracts==0.1.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
speech-study = "speech_study.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
